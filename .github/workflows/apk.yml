name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "pwa/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APKs
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Pack PWA
        run: |
          cd pwa
          zip -r ../KubGAU-iPhone-PWA.zip .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KubGAU-Teacher.apk
          cp android/student/build/outputs/apk/release/student-release.apk KubGAU-Student.apk
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload v1.0.0 KubGAU-Teacher.apk KubGAU-Student.apk KubGAU-iPhone-PWA.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 KubGAU-Teacher.apk KubGAU-Student.apk KubGAU-iPhone-PWA.zip \
              --title "КубГАУ · Журнал (камера + QR)" \
              --notes "КубГАУ Преподаватель, КубГАУ Студент и PWA для iPhone. Телефон преподавателя — камера, студент показывает QR. Без сети, Bluetooth и NFC." \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
