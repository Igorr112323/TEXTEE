name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KubGAU-Journal
          path: publish/Visits11.exe
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item publish/Visits11.exe KubGAU-Journal.exe
          gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 KubGAU-Journal.exe --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v1.0.0 KubGAU-Journal.exe --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY" --title "КубГАУ · Журнал (камера + QR)" --notes "Журнал КубГАУ — готовый exe. Телефон преподавателя сканирует QR студентов. Без сети, Bluetooth и NFC."
          }
