plugins {
    id "com.android.application"
}

android {
    namespace "ru.kubgau.student"
    compileSdk 34

    defaultConfig {
        applicationId "ru.kubgau.student"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
